function parseCSV(t){
  const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;
    else if(ch==','){r.push(c);c=''}
    else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);rows.push(r);r=[];c=''}
    else c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}
  return rows;
}

function toRecords(rows){
  const head=rows[0], kinds=[];
  for(let c=7;c<head.length;c+=2) if(clean(head[c])) kinds.push({name:clean(head[c]),col:c});
  let curGroup='',curYear='',prev={};   // prev：合併儲存格往下沿用的值
  const out=[];
  for(const r of rows.slice(1)){
    const year=clean(r[1]); if(!year) continue;
    if(year!==curYear){curYear=year;prev={}}
    if(clean(r[2])){curGroup=clean(r[2]);prev={}}
    const subject=clean(r[3]); if(!subject) continue;
    const links=[];
    for(const k of kinds){
      const label=clean(r[k.col]), url=clean(r[k.col+1]);
      let u=null;
      if(/^https?:\/\//.test(url)){u=url;prev[k.name]=url}
      else if(!label&&!url){u=prev[k.name]||null}   // 空白＝合併儲存格的延續
      else prev[k.name]=null;                       // "-" 之類：沒有資料
      if(u) links.push({kind:k.name,url:u});
    }
    out.push({year,group:curGroup,subject,links});
  }
  return out;
}

// 第二個分頁：科目在欄，每組資源是「標籤列＋網址列」兩列，類型寫在 [ ] 內
const KIND2={'題':'試題','影':'影音','非':'非選評分','解':'詳解'};
function kindName(tag){
  const m=tag.match(/^\[(.+?)(?:\((.+?)\))?\]$/); if(!m)return '';
  return (KIND2[m[1]]||m[1])+(m[2]?'('+m[2]+')':'');
}
function toRecords2(rows){
  const head=rows[0], subj=[];
  for(let c=4;c<head.length;c++) if(clean(head[c])) subj.push({name:clean(head[c]),col:c});
  const years=new Map();
  let prevYear='',prevTag='';
  for(const r of rows.slice(1)){
    const y=clean(r[1])||prevYear, tag=clean(r[2])||prevTag;
    if(clean(r[1])) prevYear=clean(r[1]);
    if(clean(r[2])) prevTag=clean(r[2]);
    if(!/^\d+/.test(y))continue;
    const kind=kindName(tag); if(!kind)continue;
    for(const s of subj){
      const url=clean(r[s.col]);
      if(!/^https?:\/\//.test(url))continue;
      if(!years.has(y))years.set(y,new Map());
      const m=years.get(y); if(!m.has(s.name))m.set(s.name,[]);
      m.get(s.name).push({kind,url});
    }
  }
  const out=[];
  for(const [year,m] of years)
    for(const s of subj) if(m.has(s.name)) out.push({year,group:'',subject:s.name,links:m.get(s.name)});
  return out;
}

function parseAbout(rows){
  const a={};
  for(const r of rows){const k=clean(r[0]),v=clean(r[1]);
    if(k==='製表者')a.maker=v;else if(k==='Email')a.email=v;else if(k==='聲明')a.notice=v;
    else if(/^https?:\/\//.test(k))a.link=k;else if(k.startsWith('最後更新日期'))a.updated=k.replace(/^最後更新日期[：:]\s*/,'')}
  return a;
}
function renderAbout(a){
  const f=$('about');f.innerHTML='';
  const add=(txt,href)=>{const p=document.createElement('p');
    if(href){const x=document.createElement('a');x.href=href;x.textContent=txt;x.target='_blank';x.rel='noopener';p.appendChild(x)}else p.textContent=txt;f.appendChild(p)};
  if(a.notice)add(a.notice);
  if(a.maker)add('製表者：'+a.maker);
  if(a.email)add(a.email,'mailto:'+a.email);
  if(a.link)add(a.link,a.link);
  if(a.updated)$('count').textContent+='　資料更新：'+a.updated;
}
let DATA=[],CUR=DATASETS[0],ABOUT={};
const $=id=>document.getElementById(id);
const yearNum=y=>parseInt(y,10);

function fillSelect(sel,vals){
  const first=sel.options[0];sel.innerHTML='';sel.appendChild(first);
  vals.forEach(v=>{const o=document.createElement('option');o.value=o.textContent=v;sel.appendChild(o)});
}
function initFilters(){
  fillSelect($('year'),[...new Set(DATA.map(d=>d.year))]);
  const groups=[...new Set(DATA.map(d=>d.group).filter(Boolean))];
  fillSelect($('group'),groups);$('group').style.display=groups.length?'':'none';
  $('year').value=$('group').value=$('kind').value=$('q').value='';
  fillSelect($('kind'),[...new Set(DATA.flatMap(d=>d.links.map(l=>l.kind)))]);
}
function render(){
  const y=$('year').value,g=$('group').value,k=$('kind').value,q=$('q').value.trim().toLowerCase();
  const byYear=new Map();let n=0;
  for(const d of DATA){
    if(y&&d.year!==y)continue;
    if(g&&d.group!==g)continue;
    if(q&&!(d.subject+d.group).toLowerCase().includes(q))continue;
    const links=k?d.links.filter(l=>l.kind===k):d.links;
    if(!links.length)continue;
    if(!byYear.has(d.year))byYear.set(d.year,[]);
    byYear.get(d.year).push({...d,links});n++;
  }
  const box=$('list');box.innerHTML='';
  if(!n){box.innerHTML='<div class="empty">沒有符合的資料</div>';$('count').textContent='';return}
  $('count').textContent=`共 ${n} 筆`;
  for(const [yr,items] of byYear){
    const h=document.createElement('div');h.className='year';
    h.innerHTML=`${yr.replace('*','')} 學年度${yr.includes('*')?'<small>試辦／特殊</small>':''}`;
    box.appendChild(h);
    for(const d of items){
      const c=document.createElement('div');c.className='card';
      const s=document.createElement('div');s.className='subj';
      s.textContent=d.subject;
      if(d.group&&d.group!==d.subject){const sp=document.createElement('span');sp.textContent=d.group;s.appendChild(sp)}
      c.appendChild(s);
      const w=document.createElement('div');w.className='links';
      for(const l of d.links){
        const a=document.createElement('a');a.className='chip';a.href=l.url;a.target='_blank';a.rel='noopener';a.textContent=l.kind;w.appendChild(a)}
      c.appendChild(w);box.appendChild(c);
    }
  }
}
function setData(recs,status){
  DATA=recs;initFilters();render();$('status').innerHTML=status;renderAbout(ABOUT);
}
['year','group','kind'].forEach(id=>$(id).addEventListener('change',render));
$('q').addEventListener('input',render);

function load(ds){
  CUR=ds;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.id===ds.id));
  setData(SNAPSHOTS[ds.id],`（內嵌資料，${SNAPSHOT_DATE}）`);
  fetch(`${BASE}?gid=${ds.gid}&single=true&output=csv`).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()})
    .then(txt=>{if(CUR!==ds)return;const recs=ds.parse(parseCSV(txt));if(recs.length)setData(recs,'<b>● 已同步試算表最新資料</b>')})
    .catch(e=>console.warn('無法讀取試算表，沿用內嵌資料：',e));
}
DATASETS.forEach(ds=>{const b=document.createElement('button');b.className='tab';b.dataset.id=ds.id;b.textContent=ds.title;b.onclick=()=>load(ds);$('tabs').appendChild(b)});
ABOUT=SNAPSHOTS.about;
load(DATASETS[0]);
fetch(BASE+'?gid='+ABOUT_GID+'&single=true&output=csv').then(r=>{if(!r.ok)throw new Error(r.status);return r.text()})
  .then(txt=>{const a=parseAbout(parseCSV(txt));if(a.maker||a.notice){ABOUT=a;render();renderAbout(a)}}).catch(()=>{});
</script>
